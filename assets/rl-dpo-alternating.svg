<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="604" viewBox="0 0 1500 604" role="img" aria-labelledby="rl-dpo-title rl-dpo-desc">
  <title id="rl-dpo-title">AetherSearch: RL and DPO alternating training</title>
  <desc id="rl-dpo-desc">Proposed workflow, not yet implemented or experimentally validated. After 100 successful RL updates, freeze the current policy and construct up to 256 verified action pairs. If any pairs are accepted, run one DPO epoch; otherwise skip DPO. Both branches resume with fresh RL rollouts before the next cycle.</desc>
  <rect x="1" y="1" width="1498" height="602" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="48" font-size="12" font-weight="700" letter-spacing="2.2" fill="#64748B">AETHERSEARCH / TRAINING DESIGN</text>
    <text x="48" y="96" font-size="34" font-weight="700" fill="#0F172A">RL and DPO alternating training</text>
    <text x="48" y="128" font-size="17" fill="#475569">A short preference correction after every 100 successful RL updates.</text>
    <rect x="1250" y="28" width="202" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1" />
    <circle cx="1270" cy="44" r="4" fill="#94A3B8" />
    <text x="1284" y="48" font-size="11" font-weight="700" letter-spacing="1.2" fill="#475569">DESIGN PROPOSAL</text>

    <circle cx="54" cy="184" r="5" fill="#2563EB" />
    <text x="70" y="189" font-size="13" font-weight="700" letter-spacing="1.6" fill="#1D4ED8">EXPLORE</text>
    <path d="M170 184 H492" stroke="#BFDBFE" stroke-width="2" />
    <circle cx="538" cy="184" r="5" fill="#0D9488" />
    <text x="554" y="189" font-size="13" font-weight="700" letter-spacing="1.6" fill="#0F766E">VERIFY</text>
    <path d="M642 184 H1002" stroke="#99F6E4" stroke-width="2" />
    <circle cx="1058" cy="184" r="5" fill="#7C3AED" />
    <text x="1074" y="189" font-size="13" font-weight="700" letter-spacing="1.6" fill="#6D28D9">REFINE &amp; RESUME</text>
    <path d="M1256 184 H1452" stroke="#DDD6FE" stroke-width="2" />

    <!-- The seven directed edges preserve the original workflow. -->
    <g fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path id="edge-r-f" d="M268 288 H306" />
      <path id="edge-f-v" d="M492 288 H530" />
      <path id="edge-v-c" d="M772 288 H810" />
      <path id="edge-d-n" d="M1237 288 H1278" />
      <path id="edge-c-n" d="M907 364 V398 Q907 410 919 410 H1354 Q1366 410 1366 398 V356" />
    </g>
    <path id="edge-c-d" d="M1002 288 H1050" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" />
    <path id="edge-n-r" d="M1452 288 H1466 Q1480 288 1480 302 V484 Q1480 500 1464 500 H174 Q158 500 158 484 V356" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="#64748B">
      <path d="M306 288 L297 283 L297 293 Z" />
      <path d="M530 288 L521 283 L521 293 Z" />
      <path d="M810 288 L801 283 L801 293 Z" />
      <path d="M1278 288 L1269 283 L1269 293 Z" />
      <path d="M1366 356 L1361 365 L1371 365 Z" />
    </g>
    <path d="M1050 288 L1041 283 L1041 293 Z" fill="#0F766E" />
    <path d="M158 356 L153 365 L163 365 Z" fill="#2563EB" />

    <g id="node-r">
      <rect x="48" y="222" width="220" height="132" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
      <text x="70" y="251" font-size="11" font-weight="700" letter-spacing="1.1" fill="#1D4ED8">ON-POLICY RL</text>
      <text x="70" y="290" font-size="21" font-weight="700" fill="#0F172A">100 successful</text>
      <text x="70" y="321" font-size="25" font-weight="700" fill="#0F172A">RL updates</text>
    </g>
    <g id="node-f">
      <rect x="308" y="222" width="184" height="132" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="330" y="251" font-size="11" font-weight="700" letter-spacing="1.1" fill="#64748B">SNAPSHOT</text>
      <text x="330" y="290" font-size="18" font-weight="700" fill="#0F172A">Freeze current</text>
      <text x="330" y="319" font-size="21" font-weight="700" fill="#0F172A">policy</text>
    </g>
    <g id="node-v">
      <rect x="532" y="222" width="240" height="132" rx="16" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5" />
      <text x="554" y="251" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0F766E">PREFERENCE SET</text>
      <text x="554" y="290" font-size="25" font-weight="700" fill="#0F172A">Up to 256</text>
      <text x="554" y="319" font-size="17" font-weight="700" fill="#0F172A">verified action pairs</text>
    </g>
    <g id="node-c">
      <path d="M907 212 L1002 288 L907 364 L812 288 Z" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="1.5" stroke-linejoin="round" />
      <text x="907" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">Accepted</text>
      <text x="907" y="309" text-anchor="middle" font-size="20" font-weight="700" fill="#115E59">pairs?</text>
    </g>
    <g id="node-d">
      <rect x="1052" y="222" width="185" height="132" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5" />
      <text x="1074" y="251" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6D28D9">DPO CORRECTION</text>
      <text x="1074" y="290" font-size="25" font-weight="700" fill="#0F172A">One DPO</text>
      <text x="1074" y="321" font-size="25" font-weight="700" fill="#0F172A">epoch</text>
    </g>
    <g id="node-n">
      <rect x="1280" y="222" width="172" height="132" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" />
      <text x="1302" y="251" font-size="11" font-weight="700" letter-spacing="1.1" fill="#6D28D9">RESUME RL</text>
      <text x="1302" y="290" font-size="25" font-weight="700" fill="#0F172A">Fresh</text>
      <text x="1302" y="321" font-size="25" font-weight="700" fill="#0F172A">rollouts</text>
    </g>

    <text x="1027" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">Yes</text>
    <rect x="1023" y="395" width="155" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="1100.5" y="415" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" fill="#475569">NO · SKIP DPO</text>
    <rect x="559" y="482" width="382" height="36" rx="18" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="750" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">Repeat after 100 successful RL updates</text>

    <path d="M48 546 H1452" stroke="#E2E8F0" />
    <text x="48" y="576" font-size="15" fill="#64748B">If no pair passes verification, skip DPO. Resume RL with fresh trajectories in either case.</text>
  </g>
</svg>
