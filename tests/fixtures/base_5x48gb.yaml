# Explicit test compose for legacy algorithm/config unit tests.
# The production base is intentionally abstract; this fixture supplies the
# old five-GPU test capacity explicitly so tests do not depend on hidden base
# includes.
extends: ../../configs/base.yaml

# The generic base deliberately carries no launch-ready evaluation profile.
# Legacy algorithm tests compose the released full-validation contract here.
evaluation:
  asynchronous: true
  role: eval
  batch_size: 1
  retry_seconds: 300
  manifest_path: ${AETHERSEARCH_RUNTIME_ROOT}/full_search_r1_test_manifest.json
  manifest_mode: full_validation
  expected_validation_sha256: 30aa887b6d47e06e8c0f6f5307c88fe4e13461ac25a20ec0a5433ad7a4fe25dc
  expected_row_count: 51713
  expected_source_counts:
    2wikimultihopqa: 12576
    bamboogle: 125
    hotpotqa: 7405
    musique: 2417
    nq: 3610
    popqa: 14267
    triviaqa: 11313
  expected_manifest_sha256: a37096d3cab04dfee994318a7059e1151eef1a0df4eb444d6f8544f57ea65baa
  batch_prompts: 32
  do_sample: false
  temperature: 0.0
  sampling_top_p: 1.0
  model_dtype: bfloat16
  attention_backend: flash_attention_2

includes:
  - ../../configs/hardware_5x48gb.yaml
