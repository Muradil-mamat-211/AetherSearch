# Explicit test compose for legacy algorithm/config unit tests.
# The production base is intentionally abstract; this fixture supplies the
# old five-GPU test capacity explicitly so tests do not depend on hidden base
# includes.
extends: ../../configs/base.yaml

# The generic base deliberately carries no launch-ready evaluation profile.
# Legacy algorithm tests compose the released full-validation contract here.
evaluation:
  asynchronous: true
  role: eval
  batch_size: 1
  retry_seconds: 300
  manifest_path: ${AETHERSEARCH_RUNTIME_ROOT}/aethersearch_eval_1400_manifest.json
  manifest_mode: full_validation
  expected_validation_sha256: ecd634aac24013213ceca3523dc024d82544c5479546fe205da24d8e8ffea678
  expected_row_count: 1400
  expected_source_counts:
    2wikimultihopqa: 212
    bamboogle: 125
    hotpotqa: 212
    musique: 212
    nq: 213
    popqa: 213
    triviaqa: 213
  expected_manifest_sha256: 7e0ce6c65b056788c049811b2c2a7a525e205be2359184a5be5183ce6db86d74
  batch_prompts: 32
  do_sample: false
  temperature: 0.0
  sampling_top_p: 1.0
  model_dtype: bfloat16
  attention_backend: flash_attention_2

includes:
  - ../../configs/hardware_5x48gb.yaml
