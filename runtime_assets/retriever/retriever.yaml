server:
  host: 127.0.0.1
  port: 8000
retrieval:
  top_k: 3
  bm25_top_n: 20
  dense_top_n: 20
  fusion_alpha: 0.5
  corpus_path: ${AETHERSEARCH_CORPUS_PATH}
  bm25_index_path: ${AETHERSEARCH_BM25_INDEX_PATH}
  dense_index_path: ${AETHERSEARCH_DENSE_INDEX_PATH}
  query_encoder: ${AETHERSEARCH_DENSE_ENCODER_PATH}
  query_encoder_name: e5
  query_max_length: 256
scheduling:
  dense_query_batch_size: 64
  bm25_workers: 16
  request_batch_wait_ms: 5.0
  request_batch_max_queries: 256
  request_wait_timeout_seconds: 180.0
gpu:
  cuda_visible_devices: "0"
  faiss_gpu: true
  require_faiss_gpu: true
  stream_flat: true
  faiss_device: 0
  use_float16: true
  temp_memory_mb: 256
  add_batch_size: 0
  encoder_float16: true
