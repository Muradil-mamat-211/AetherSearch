extends: formal_train.yaml

algorithm_mode: answer_only_ragen2_mica_ig_v1_singleton_outcome

project:
  name: igpo_ragen2_mica_ig_v1

paths:
  runtime_root: ${AETHERSEARCH_RUNTIME_ROOT}/formal_training

checkpoint:
  # Keep every complete formal checkpoint. Cadence remains every 20
  # successful updates; no retention-based deletion is allowed.
  formal_limit: null
  # A checkpoint is integrity-checked in a read-only subprocess at commit.
  # Full distributed restore is qualified in a fresh runtime, avoiding a
  # second transient Actor+optimizer footprint in live colocated workers.
  live_distributed_reload_verification: false
  # Enabled only in a verified recovery run whose cadence checkpoint exists
  # but whose derived model export/eval task was interrupted before commit.
  materialize_missing_cadence_artifacts_on_resume: false

selection:
  mode: answer_outcome_only_scaled_top_p
  signal: answer_outcome_only

advantage:
  mode: mica_ig_v1
  search_task_mode: answer_only_ragen2_mica_ig_v1_singleton_outcome
  search_advantage_formula: "Z_O if peer_count == 1 else 0.5*A_ret + 0.5*A_loc"
  outcome_fallback_to_search: true
  future_ig_accumulation: false
  sqrt_n_rescale: false
  rescale_count_mode: none_mica_raw_suffix_return
  search_formula_terms:
    - raw_exact_ig
    - literal_raw_ig_suffix_return
    - prompt_search_depth_local_advantage
    - prompt_search_depth_return_advantage
    - singleton_normalized_terminal_outcome
  sufficiency_probe:
    enabled: false
    pre_search_enabled: false
    post_search_enabled: false

mica:
  gamma: 1.0
  alpha: 0.5
  normalization_scope: prompt_search_depth
  singleton_fallback: normalized_terminal_outcome
  cross_prompt_normalization: false
  cross_depth_normalization: false
  raw_ig_fallback: false
  routed_outcome: false
  role_gate: false
  debug_answer_probes: false
