# Validated reference topology: one 48 GiB GPU for retrieval/evaluation and
# three 48 GiB GPUs for colocated vLLM/FSDP2 RL training.
hardware:
  total_physical_gpus: 4
  gpu_memory_gb: 48
  expected_host_ram_gb: 360
  expected_cpu_cores: 48
  cpu_reserved_for_os: 4

# Canonical topology input. Runtime code derives all compatibility fields from
# this block; new profiles should not duplicate those derived values.
topology:
  cluster_mode: local
  nnodes: 1
  roles:
    retriever:
      physical_gpu: 0
    eval:
      colocate_with: retriever
    rl:
      physical_gpus_by_node: [[1, 2, 3]]
  ray:
    placement_strategy: STRICT_PACK
    cluster_mode: local
    address: local
  rollout:
    data_parallel_size: 3
    tensor_parallel_size: 1
