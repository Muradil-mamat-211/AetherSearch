retriever:
  service_url: http://127.0.0.1:8000
  retrieve_endpoint: /retrieve
  health_endpoint: /health
  mode: hybrid
  top_k: 3
  server_source: ${AETHERSEARCH_PROJECT_ROOT}/runtime_assets/retriever/hybrid_retrieval_server.py
  server_config_source: ${AETHERSEARCH_PROJECT_ROOT}/runtime_assets/retriever/retriever.yaml
  corpus_path: ${AETHERSEARCH_CORPUS_PATH}
  bm25_index_path: ${AETHERSEARCH_BM25_INDEX_PATH}
  dense_index_path: ${AETHERSEARCH_DENSE_INDEX_PATH}
  dense_encoder_path: ${AETHERSEARCH_DENSE_ENCODER_PATH}
  dense_encoder_name: e5
  dense_index_type: GpuIndexFlatIP
  require_faiss_gpu: true
  faiss_device_inside_retriever_namespace: 0
  dense_query_batch_size: 64
  bm25_workers: 16
  request_batch_wait_ms: 5.0
  request_batch_max_queries: 256
  timeout_seconds: 180.0
  fusion_alpha: 0.5
  bm25_top_n: 20
  dense_top_n: 20
