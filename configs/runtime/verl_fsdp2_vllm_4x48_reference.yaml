# Runtime-only tuning for the formally qualified 4x48 GiB reference profile.
#
# Physical devices, node layout, and role assignment belong exclusively to
# configs/hardware/4x48gb_3rl.yaml.  This file owns process/runtime capacity;
# config loading materializes legacy top-level compatibility fields from here.
runtime:
  ray:
    retriever_pool_cpus: 8
    rl_engine_cpus_per_gpu: 3
    vllm_http_server_cpus: 1
    control_actor_cpus:
      prompt_sampler: 2
      candidate_pool: 2
      metrics: 1
      outcome_worker: 1
      checkpoint_commit: 1
      exact_ig_task_builder: 2
    outcome_worker_count: 4
    exact_ig_task_builder_count: 2
    agent_loop_worker_count: 12
    memory_monitor_refresh_ms: 1000
    memory_usage_threshold: 0.80
    object_store_gb: 48
    memory_safety_reserve_gb: 64
    object_spilling_directory: runtime/ray_spill

  rollout:
    gpu_memory_utilization: 0.48
    max_num_seqs: 64

  learner:
    micro_batch_size: 6

  evaluation:
    minimum_free_memory_gib: 10
    max_memory_fraction: 0.24

  environment:
    driver:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    worker:
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      TOKENIZERS_PARALLELISM: "true"
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
    process:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    retriever:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"

  retriever:
    query_max_length: 256
    dense_query_batch_size: 64
    bm25_workers: 16
    request_batch_wait_ms: 5.0
    request_batch_max_queries: 256
    request_wait_timeout_seconds: 180.0
    client_batch_wait_ms: 5.0
    client_max_concurrency: 128
    client_max_batch_queries: 256
    client_request_timeout_seconds: 30.0
    client_network_retries: 2
    health_timeout_seconds: 30.0
    retrieval_use_fp16: true
    faiss_gpu: true
    require_faiss_gpu: true
    faiss_gpu_stream_flat: true
    faiss_gpu_device: 0
    faiss_gpu_use_fp16: true
    faiss_temp_memory_mb: 256
    faiss_add_batch_size: 0
    dense_device: cuda
    dense_index_type: GpuIndexFlatIP
