extends: base.yaml

paths:
  runtime_root: ${AETHERSEARCH_RUNTIME_ROOT}/formal_training

optimizer:
  name: adamw
  learning_rate: 2.0e-7
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1.0

scheduler:
  name: constant_with_warmup
  warmup_successful_updates: 10
  total_successful_updates: null
  advance_on_skip: false

rollout:
  do_sample: true
  temperature: 1.0
  sampling_top_p: 0.95
  top_p: 0.95
  top_k: 0
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  group_size: 16
  max_search_turns: 5
  max_model_tokens_per_turn: 500
  max_new_tokens_per_turn: 500
  max_information_tokens_per_turn: 500

# Answer coefficients remain explicit. Search uses S/N priority, effective
# cumulative normalized local IG, and Probe-routed normalized Outcome.
advantage:
  lambda_outcome: 1.0
  lambda_format: 1.0

candidate_pool:
  initial_prompts: 64
  refill_prompts: 32
  max_prompts: 128
  group_size: 16

selection:
  variance_mass_top_p: 0.90
  top_p_mass: 0.90
  min_selected: 32
  minimum_selected_prompts: 32
  max_selected: 36
  maximum_selected_prompts: 36
  alpha_ig: 0.5
  alpha_outcome: 0.5

evaluation:
  asynchronous: true
  role: eval
  batch_size: 1
  retry_seconds: 300
  manifest_path: ${AETHERSEARCH_RUNTIME_ROOT}/aethersearch_eval_1400_manifest.json
  manifest_mode: full_validation
  expected_validation_sha256: ecd634aac24013213ceca3523dc024d82544c5479546fe205da24d8e8ffea678
  expected_row_count: 1400
  expected_source_counts:
    2wikimultihopqa: 212
    bamboogle: 125
    hotpotqa: 212
    musique: 212
    nq: 213
    popqa: 213
    triviaqa: 213
  expected_manifest_sha256: 7e0ce6c65b056788c049811b2c2a7a525e205be2359184a5be5183ce6db86d74
  batch_prompts: 32
  do_sample: false
  temperature: 0.0
  sampling_top_p: 1.0
  model_dtype: bfloat16
  attention_backend: flash_attention_2

formal:
  total_successful_updates: null
  resume_from_successful_update: 0
  fresh_start_required: true
  actor_init_tree_sha256: a2cf15da06b06eb84a74182853f9c9a697aa0cce047ff34369b5fb737cdbd08f
  reference_tree_sha256: a2cf15da06b06eb84a74182853f9c9a697aa0cce047ff34369b5fb737cdbd08f
  tokenizer_sha256: 22a5d06ea8962e1236779430602bd1871519c4bd0debfaaa53827f252fcb9019
  retriever_index_sha256: 69c98463fdb41fc08737d88513c597725f311c44f7ba6dca4b05d8c7c658d166
  retriever_config_sha256: 151c3d85d30ca52b68a98b74ae86f5bbf99dc9c16c48e71b7474e40584190c22

formal_schedule:
  optimizer_family: AdamW
  learning_rate: 2.0e-7
  weight_decay: 0.0
  optimizer_betas: [0.9, 0.999]
  optimizer_epsilon: 1.0e-8
  scheduler: constant
  warmup: 10
  # Capacity-dependent; supplied by an explicit hardware/reference profile.
  learner_micro_batch_size: null
  total_successful_updates: null
  checkpoint_every_successful_updates: 20
  fixed_eval_every_successful_updates: 20
  maximum_prompt_length: 2048
  maximum_response_length: 6144
  maximum_model_length: 8192
  maximum_extended_sequence_length: 16384
  maximum_position_id_exclusive: 32768
  sampling_temperature_approval: 1.0
  sampling_top_p_approval: 0.95
  source: user_frozen_formal_training_preflight

checkpoint:
  formal_limit: 2
  readonly_subprocess_verification: true

runtime_test:
  force_refill_after_initial_pool: false
