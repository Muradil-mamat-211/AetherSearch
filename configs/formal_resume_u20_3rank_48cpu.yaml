extends: formal_resume_u20_3rank.yaml

includes:
  - hardware/4x48gb_3rl.yaml

# Distributed/resource-only validation profile for the four-GPU host with
# three RL GPUs (physical 1-3) and 48 host CPU cores. Algorithm fields inherit
# unchanged from the validated U20 resume profile.
paths:
  runtime_root: ${AETHERSEARCH_RUNTIME_ROOT}/3rank_resume_48cpu_validation

checkpoint:
  formal_limit: 3
  model_checkpoints_retain_all: true
  readonly_subprocess_verification: true

monitoring:
  interval_seconds: 600
  watchdog_interval_seconds: 60
  target_successful_update: 500
  stale_metrics_seconds: 7200
  minimum_disk_free_gib: 80
