[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethersearch"
version = "1.0.0"
description = "Strict rollout-start on-policy search-augmented reinforcement learning"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "aiohttp>=3.10",
  "pandas>=2.0",
  "pyarrow>=14.0",
]

[project.scripts]
aethersearch-config = "agentic_rl.config:main"
aethersearch-runtime = "agentic_rl.runtime.entrypoint:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
